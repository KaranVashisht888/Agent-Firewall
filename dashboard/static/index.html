<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mcp-firewall dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --border: #273049;
    --text: #e6e9f0;
    --muted: #8c93a8;
    --allow: #2fb170;
    --deny: #e5534b;
    --warn: #d8a534;
    --passthrough: #5b6478;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }
  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    min-width: 120px;
  }
  .stat .n { font-size: 22px; font-weight: 600; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  section { margin-bottom: 32px; }
  section h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
  .controls { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  select, button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .03em; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: #0b0f18;
  }
  .badge.allow { background: var(--allow); }
  .badge.deny { background: var(--deny); color: #fff; }
  .badge.passthrough { background: var(--passthrough); color: #fff; }
  .badge.warn { background: var(--warn); }
  .badge.enforced-yes { background: var(--deny); color: #fff; }
  .badge.enforced-no { background: var(--passthrough); color: #fff; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  .reason { color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>mcp-firewall dashboard</h1>
  <p>Read-only view of a local audit.db, served only on 127.0.0.1. No data leaves this machine.</p>
</header>
<main>
  <div class="stats" id="stats"></div>

  <section>
    <h2>Call timeline
      <span class="controls">
        <select id="serverFilter"><option value="">All servers</option></select>
        <select id="verdictFilter">
          <option value="">All verdicts</option>
          <option value="ALLOW">ALLOW</option>
          <option value="DENY">DENY</option>
          <option value="PASSTHROUGH">PASSTHROUGH</option>
        </select>
        <button id="refreshCalls">Refresh</button>
      </span>
    </h2>
    <div id="callsContainer"></div>
  </section>

  <section>
    <h2>Detector findings
      <span class="controls">
        <button id="refreshFindings">Refresh</button>
      </span>
    </h2>
    <div id="findingsContainer"></div>
  </section>
</main>
<footer>mcp-firewall &middot; deterministic information-flow control, not an LLM judge</footer>

<script>
let allCalls = [];
let allFindings = [];

function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function verdictBadge(v) {
  if (!v) return "";
  const cls = v.toLowerCase();
  return `<span class="badge ${cls}">${esc(v)}</span>`;
}

function severityBadge(v) {
  const cls = v === "deny" ? "deny" : "warn";
  return `<span class="badge ${cls}">${esc(v)}</span>`;
}

function enforcedBadge(v) {
  return v ? '<span class="badge enforced-yes">enforced</span>' : '<span class="badge enforced-no">logged</span>';
}

function renderStats() {
  const total = allCalls.length;
  const denies = allCalls.filter(c => c.verdict === "DENY").length;
  const enforcedFindings = allFindings.filter(f => f.enforced).length;
  document.getElementById("stats").innerHTML = [
    ["Total calls", total],
    ["Denied", denies],
    ["Findings", allFindings.length],
    ["Enforced findings", enforcedFindings],
  ].map(([label, n]) => `<div class="stat"><div class="n">${n}</div><div class="label">${label}</div></div>`).join("");
}

function populateServerFilter() {
  const sel = document.getElementById("serverFilter");
  const current = sel.value;
  const servers = [...new Set(allCalls.map(c => c.server_name))].sort();
  sel.innerHTML = '<option value="">All servers</option>' + servers.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  sel.value = current;
}

function renderCalls() {
  const serverFilter = document.getElementById("serverFilter").value;
  const verdictFilter = document.getElementById("verdictFilter").value;
  let rows = allCalls;
  if (serverFilter) rows = rows.filter(c => c.server_name === serverFilter);
  if (verdictFilter) rows = rows.filter(c => c.verdict === verdictFilter);

  const container = document.getElementById("callsContainer");
  if (rows.length === 0) {
    container.innerHTML = '<div class="empty">No calls match the current filters.</div>';
    return;
  }
  const body = rows.map(c => `
    <tr>
      <td class="mono">${esc(c.ts)}</td>
      <td>${esc(c.server_name)}</td>
      <td>${esc(c.direction)}</td>
      <td>${esc(c.method || "")}</td>
      <td class="mono">${esc(c.tool_name || "")}</td>
      <td>${verdictBadge(c.verdict)}</td>
      <td class="reason">${esc(c.reason || "")}</td>
    </tr>`).join("");
  container.innerHTML = `<table>
    <thead><tr><th>Time</th><th>Server</th><th>Dir</th><th>Method</th><th>Tool</th><th>Verdict</th><th>Reason</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}

function renderFindings() {
  const container = document.getElementById("findingsContainer");
  if (allFindings.length === 0) {
    container.innerHTML = '<div class="empty">No detector findings recorded.</div>';
    return;
  }
  const body = allFindings.map(f => `
    <tr>
      <td class="mono">${esc(f.ts)}</td>
      <td>${severityBadge(f.severity)}</td>
      <td>${esc(f.category)}</td>
      <td class="mono">${esc(f.server_name)}.${esc(f.tool_name)}</td>
      <td>${enforcedBadge(f.enforced)}</td>
      <td>${f.score !== null && f.score !== undefined ? Number(f.score).toFixed(2) : ""}</td>
      <td>${esc(f.message)}</td>
    </tr>`).join("");
  container.innerHTML = `<table>
    <thead><tr><th>Time</th><th>Severity</th><th>Category</th><th>Tool</th><th>Status</th><th>Score</th><th>Message</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}

async function loadCalls() {
  const res = await fetch("/api/calls");
  allCalls = res.ok ? await res.json() : [];
  populateServerFilter();
  renderCalls();
  renderStats();
}

async function loadFindings() {
  const res = await fetch("/api/findings");
  allFindings = res.ok ? await res.json() : [];
  renderFindings();
  renderStats();
}

document.getElementById("refreshCalls").addEventListener("click", loadCalls);
document.getElementById("refreshFindings").addEventListener("click", loadFindings);
document.getElementById("serverFilter").addEventListener("change", renderCalls);
document.getElementById("verdictFilter").addEventListener("change", renderCalls);

loadCalls();
loadFindings();
</script>
</body>
</html>
