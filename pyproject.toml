[project]
name = "mcp-firewall"
version = "0.1.0"
description = "A local, deterministic information-flow-control proxy for MCP tool calls."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mcp>=1.0",
]

[project.scripts]
mcp-firewall = "mcp_firewall.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_firewall*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
